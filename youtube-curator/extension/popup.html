<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; font-family: "Noto Sans KR", sans-serif; background: #1a1a2e; color: #eee; }
    header { padding: 14px 16px 10px; font-weight: 700; font-size: 15px; }
    section { padding: 0 16px 12px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #4f6ef7; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #444; cursor: default; }
    textarea { width: 100%; box-sizing: border-box; height: 56px; border-radius: 8px; border: 1px solid #444; background: #12121f; color: #eee; padding: 8px; font-size: 12px; resize: none; }
    #status { min-height: 18px; font-size: 12px; color: #8fd; padding: 4px 0; }
    ul { list-style: none; margin: 4px 0 0; padding: 0; max-height: 160px; overflow-y: auto; }
    li { font-size: 12px; padding: 5px 0; border-top: 1px solid #2c2c44; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li a { color: #9ab; text-decoration: none; }
    footer { display: flex; justify-content: space-between; padding: 8px 16px 12px; font-size: 12px; }
    footer a { color: #789; text-decoration: none; }
    h4 { margin: 8px 0 4px; font-size: 12px; color: #99a; }
  </style>
</head>
<body>
  <header>🗂️ My Curator</header>
  <section>
    <button id="save-current">현재 탭 영상 저장</button>
    <div id="status"></div>
    <h4>링크 붙여넣기 (여러 개 가능)</h4>
    <textarea id="paste" placeholder="https://www.youtube.com/watch?v=..."></textarea>
    <button id="save-pasted" style="margin-top:6px; background:#2e8b6e;">붙여넣은 링크 저장</button>
    <h4>최근 저장</h4>
    <ul id="recent"></ul>
  </section>
  <footer>
    <a href="#" id="open-options">⚙️ 설정</a>
    <a href="https://app.notion.com/p/9f6d921ba2664c2e8a9f737903c2c8d9" target="_blank">📺 노션 대시보드</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
