<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.googleusercontent.com"
    />
    <title>neural-flow</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="lock" hidden></div>
    <div class="shell" id="shell">
      <aside class="side" id="side"></aside>
      <main class="main" id="main">
        <!-- 새 버전 알림 배너 (다시 그리지 않는 고정 영역) -->
        <div id="update-banner" hidden></div>
        <!-- 언제든 입력: 모든 화면 상단에 고정 (다시 그리지 않아 입력이 끊기지 않는다) -->
        <form class="ask" id="ask" autocomplete="off">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <input id="ask-input" placeholder="일정이나 공지를 적거나 붙여넣으세요 — 내일 오후 3시 커피챗" />
          <kbd id="ask-kbd"></kbd>
        </form>
        <div id="ask-preview"></div>
        <div id="view"></div>
      </main>
    </div>
    <dialog id="modal" class="modal"></dialog>
    <dialog id="update-dialog" class="modal update-dialog"></dialog>
    <div id="toast" class="toast" role="status"></div>
    <script src="../shared/agenda.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="../shared/input-review.js"></script>
    <script src="app.js"></script>
  </body>
</html>
