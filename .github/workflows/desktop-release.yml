name: neural-flow desktop release

# main 에 데스크탑 앱 변경이 들어오면 Windows·macOS 설치 파일을 빌드해
# GitHub Releases 'desktop-v<package.json version>' 에 올린다.
# 노트북에서는 scripts/install.ps1 · install.sh 한 줄로 설치.
on:
  push:
    branches: [main]
    paths:
      - 'neural-flow/desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: neural-flow/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neural-flow/desktop/package-lock.json

      - run: npm ci

      # GitHub 비밀값 NF_GOOGLE_CLIENT_ID / NF_GOOGLE_CLIENT_SECRET 이 있으면 설치 파일에 구워 넣는다
      # → 기기마다 클라이언트 ID 를 붙여넣지 않고 'Google 로그인' 버튼만 누르면 된다
      - name: Bake Google OAuth client
        shell: bash
        env:
          CID: ${{ secrets.NF_GOOGLE_CLIENT_ID }}
          CSECRET: ${{ secrets.NF_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$CID" ]; then
            node -e "require('fs').writeFileSync('build-config.json', JSON.stringify({googleClientId: process.env.CID, googleClientSecret: process.env.CSECRET || ''}))"
            echo "baked google client"
          else
            echo '{}' > build-config.json
            echo "no google client secret — 간편 모드/수동 입력"
          fi

      - name: Build installer
        run: npx --yes electron-builder@26.15.3 ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 서명 인증서 없음 (개인용)

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            neural-flow/desktop/dist/*.exe
            neural-flow/desktop/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./neural-flow/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ steps.v.outputs.version }}
        run: |
          # 같은 버전으로 다시 돌면 파일만 교체한다
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "neural-flow desktop $TAG" \
              --notes "Windows: \`irm https://raw.githubusercontent.com/${{ github.repository }}/main/neural-flow/desktop/scripts/install.ps1 | iex\`
          macOS: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/neural-flow/desktop/scripts/install.sh | bash\`"
          fi
